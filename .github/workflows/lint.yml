name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  em-dash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check for em-dash in prose
        run: python3 tools/lint-em-dash.py
